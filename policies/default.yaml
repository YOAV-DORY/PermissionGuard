# Default PermissionGuard policy.
#
# Decisions: allow | deny | ask
#
# The policy fails closed: anything not described here is denied, and a policy
# file with a typo or an invalid value refuses to load.

sandbox_root: ./sandbox

actions:
  # Path-based actions are always denied when the target resolves outside
  # sandbox_root, is absolute, or passes through a symlink. The verdicts below
  # apply to targets that are inside the sandbox.
  read_file:
    inside_sandbox: allow
  write_file:
    inside_sandbox: ask
  delete_file:
    inside_sandbox: ask
  run_command:
    # Verdict for a command that passes every check in the `commands` section.
    default: ask

limits:
  max_read_bytes: 1048576        # 1 MiB
  max_write_bytes: 1048576       # 1 MiB
  max_output_bytes: 65536        # 64 KiB of captured command output
  command_timeout_seconds: 10
  max_command_length: 4096

commands:
  # What to do with a program that is not on `allowed_programs`:
  #   deny - refuse (default, safest)
  #   ask  - let a human decide (closest to "every other command needs approval")
  unknown_program: deny

  # Programs that may run (after approval, see actions.run_command.default).
  # Matched case-insensitively against the program name; globs allowed.
  allowed_programs:
    - ls
    - cat
    - head
    - tail
    - wc
    - echo
    - pwd
    - grep
    - sort
    - uniq
    - diff
    - date
    - whoami
    - mkdir
    - touch
    - cp
    - mv
    - rm
    - curl
    - wget
    - git
    - "python*"

  # Programs that may only be run with these first arguments.
  subcommands:
    git: [status, log, diff, show, branch]

  downloaders: [curl, wget]
  shells: [sh, bash, zsh, dash, ksh, csh, tcsh, fish]
  allowed_url_schemes: [http, https]

  # Used to label "touches a system path" denials.
  system_paths:
    - /etc
    - /usr
    - /bin
    - /sbin
    - /lib
    - /boot
    - /dev
    - /proc
    - /sys
    - /var
    - /root
    - /System
    - /Library
    - /private
    - /Applications

  # Programs that are denied outright, with the reason shown in the audit log.
  denied_programs:
    - id: sudo
      reason: privilege escalation
      names: [sudo, su, doas, pkexec]
    - id: command-wrapper
      reason: wrapper programs hide the real command from the policy
      names: [env, xargs, nohup, nice, time, timeout, exec, command, busybox, stdbuf, watch, setsid, chroot, nsenter, unshare, script, eval]
    - id: disk-destructive
      reason: destructive disk operation
      names: [dd, "mkfs*", "newfs*", fdisk, parted, diskutil, shred, wipefs]
    - id: system-control
      reason: shuts down or reconfigures the machine
      names: [shutdown, reboot, halt, poweroff, init, launchctl, systemctl]
    - id: permission-change
      reason: changes permissions or ownership
      names: [chmod, chown, chgrp, chattr, setfacl]
    - id: link-creation
      reason: links can point outside the sandbox
      names: [ln, link]

  # Option-level rules for allowed programs. `short` letters are matched inside
  # combined flags (-rf contains r and f); `long` options match exactly.
  forbidden_options:
    - id: rm-recursive
      reason: recursive delete
      programs: [rm]
      short: [r, R]
      long: [--recursive, --no-preserve-root]
    - id: inline-code
      reason: runs code given on the command line
      programs: ["python*"]
      short: [c, m]
    - id: curl-config
      reason: config files can redirect output anywhere
      programs: [curl]
      short: [K]
      long: [--config]
    - id: wget-execute
      reason: executes wgetrc commands
      programs: [wget]
      short: [e]
      long: [--execute]
    # Programs that follow symlinks on their own, which would let a link inside the sandbox
    # lead out of it (arguments that are links are refused separately).
    - id: follows-symlinks
      reason: follows symlinks, so it can read outside the sandbox
      programs: [grep]
      short: [R, S]
      long: [--dereference-recursive]
    - id: follows-symlinks
      reason: follows symlinks, so it can read outside the sandbox
      programs: [cp]
      short: [L]
      long: [--dereference]
    - id: follows-symlinks
      reason: a recursive diff reads through symlinks, so it can read outside the sandbox
      programs: [diff]
      short: [r]
      long: [--recursive]
