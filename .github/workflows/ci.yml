name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, Python 3.11)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The sandbox relies on POSIX file APIs (openat, O_NOFOLLOW), so test both families.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (core + the optional Anthropic SDK and MCP SDK used by their tests)
        run: python -m pip install -r requirements-llm.txt -r requirements-mcp.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Run the demo end to end
        run: python demo.py --auto-approve --sandbox "$RUNNER_TEMP/sandbox" --audit-file "$RUNNER_TEMP/audit.jsonl"

      - name: Verify the audit log written by the demo
        run: python -m permission_guard verify "$RUNNER_TEMP/audit.jsonl"

      - name: Run the prompt-injection demo (offline simulation, no API key)
        run: python demo_injection.py --auto-deny --sandbox "$RUNNER_TEMP/sandbox2" --audit-file "$RUNNER_TEMP/audit2.jsonl"

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Lint
        run: ruff check .

  package:
    name: wheel (clean venv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the wheel
        run: python -m pip wheel . --no-deps -w dist

      - name: Install into a clean venv and run from an unrelated directory
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/pip" install dist/permission_guard-*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/clean/bin/python" -m permission_guard check 'ls -la' | tee check-ask.txt
          grep -q '^ASK' check-ask.txt
          if "$RUNNER_TEMP/clean/bin/python" -m permission_guard check 'rm -rf /'; then
            echo "expected the dangerous command to be denied"; exit 1
          fi
