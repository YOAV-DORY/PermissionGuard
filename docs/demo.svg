<text x="380" y="23" text-anchor="middle" class="title">PermissionGuard - simulated assistant session</text>
<text x="20" y="52" class="t l k0" xml:space="preserve"><tspan class="c-green">$ </tspan><tspan class="c-white">python demo.py</tspan></text>
<text x="20" y="71" class="t l k1" xml:space="preserve"><tspan class="c-blue">[1] assistant requests: </tspan><tspan class="c-white">read_file('notes.txt')</tspan></text>
<text x="20" y="90" class="t l k2" xml:space="preserve"><tspan class="c-text">    </tspan><tspan class="c-green">-&gt; ALLOW / EXECUTED:</tspan><tspan class="c-text"> read_file inside sandbox is 'allow' by policy</tspan></text>
<text x="20" y="109" class="t l k3" xml:space="preserve"><tspan class="c-dim">    output:</tspan></text>
<text x="20" y="128" class="t l k4" xml:space="preserve"><tspan class="c-dim">       Shopping list:</tspan></text>
<text x="20" y="147" class="t l k5" xml:space="preserve"><tspan class="c-dim">       - milk</tspan></text>
<text x="20" y="166" class="t l k6" xml:space="preserve"><tspan class="c-dim">       - eggs</tspan></text>
<text x="20" y="185" class="t l k7" xml:space="preserve"><tspan class="c-dim">       - bread</tspan></text>
<text x="20" y="204" class="t l k8" xml:space="preserve"><tspan class="c-blue">[2] assistant requests: </tspan><tspan class="c-white">delete_file('notes.txt')</tspan></text>
<text x="20" y="223" class="t l k9" xml:space="preserve"><tspan class="c-yellow">[approval] The assistant wants to perform an action that needs your approval:</tspan></text>
<text x="20" y="242" class="t l k10" xml:space="preserve"><tspan class="c-yellow">  action        : delete_file</tspan></text>
<text x="20" y="261" class="t l k11" xml:space="preserve"><tspan class="c-yellow">  target        : notes.txt</tspan></text>
<text x="20" y="280" class="t l k12" xml:space="preserve"><tspan class="c-yellow">  resolved_path : ./sandbox/notes.txt</tspan></text>
<text x="20" y="299" class="t l k13" xml:space="preserve"><tspan class="c-yellow">  reason        : delete_file inside sandbox is 'ask' by policy</tspan></text>
<text x="20" y="318" class="t l k14 a" xml:space="preserve"><tspan class="c-yellow">  Approve? [y]es / [n]o / [s]ession (approve for rest of session): </tspan></text>
<text x="20" y="318" class="t l k15" xml:space="preserve"><tspan class="c-yellow">  Approve? [y]es / [n]o / [s]ession (approve for rest of session): </tspan><tspan class="c-white">y</tspan></text>
<text x="20" y="337" class="t l k16" xml:space="preserve"><tspan class="c-text">    </tspan><tspan class="c-green">-&gt; ALLOW / EXECUTED:</tspan><tspan class="c-text"> user approved (delete_file inside sandbox is 'ask' by policy)</tspan></text>
<text x="20" y="356" class="t l k17" xml:space="preserve"><tspan class="c-dim">    output:</tspan></text>
<text x="20" y="375" class="t l k18" xml:space="preserve"><tspan class="c-dim">       deleted notes.txt</tspan></text>
<text x="20" y="394" class="t l k19" xml:space="preserve"><tspan class="c-blue">[3] assistant requests: </tspan><tspan class="c-white">run_command('rm -rf /')</tspan></text>
<text x="20" y="413" class="t l k20" xml:space="preserve"><tspan class="c-text">    </tspan><tspan class="c-red">-&gt; DENY / BLOCKED:</tspan><tspan class="c-text"> dangerous command (recursive delete)</tspan></text>
<text x="20" y="432" class="t l k21" xml:space="preserve"><tspan class="c-green">Integrity check: OK: 5 entries, hash chain intact</tspan></text>
</svg>
