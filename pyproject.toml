[project]
name = "permission-guard"
version = "0.1.0"
description = "Policy-enforcing middleware between an AI assistant and computer tools, with approval flow and audit log."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["permission_guard"]
